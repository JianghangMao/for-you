<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#100e1b" />
  <title>狗狗和宝宝 · 我们的小小世界</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/bubbles.css" />
</head>
<body>
  <!-- 梦幻背景层 -->
  <div class="sky">
    <div class="nebula nebula-p"></div>
    <div class="nebula nebula-g"></div>
    <div class="stars"></div>
    <div class="waterlight"></div>
    <div class="sky-contour sky-contour-one"></div>
    <div class="sky-contour sky-contour-two"></div>
  </div>

  <!-- ========== 密码门 ========== -->
  <section id="gate">
    <div class="gate-box">
      <div class="gate-orb" aria-hidden="true"><span> &amp; </span></div>
      <p class="gate-overline">狗狗 &amp; 宝宝</p>
      <p class="gate-hint" id="gateTitle"></p>
      <label class="sr-only" for="gateInput">输入纪念日密码</label>
      <input id="gateInput" type="password" inputmode="numeric" maxlength="8" placeholder="输入密码" autocomplete="off" />
      <button id="gateBtn">进入</button>
      <p class="gate-err" id="gateErr" role="status"></p>
    </div>
  </section>

  <!-- ========== 开场打字机动画（密码正确后显示） ========== -->
  <div class="intro hidden" id="intro">
    <p class="intro-type" id="introType"></p>
  </div>

  <!-- ========== 应用 ========== -->
  <div id="app" class="hidden">

    <header class="topbar">
      <button class="back-btn" id="backBtn">‹ 主页</button>
      <span class="topbar-title" id="topbarTitle"></span>
    </header>

    <!-- ===== 主页：位置固定、触碰时回应的泡泡 ===== -->
    <section class="view active" id="view-home">
      <div class="hub">
        <div class="home-masthead">
          <span class="home-wordmark"><i aria-hidden="true"></i> 我们的小小世界</span>
          <span class="home-since" id="homeSince">始于 2023.03.28</span>
        </div>
        <div class="home-scene">
        <div class="hub-core">
          <p class="hero-overline">两个人的日常</p>
          <h1 class="hero-title"><span id="heroMyName">狗狗</span><span class="hero-amp">&amp;</span><span id="heroHerName">宝宝</span></h1>
          <p class="hero-greet" id="heroGreet"></p>
          <div class="timer" id="timer" aria-label="恋爱计时"></div>
          <div class="hero-meta">
            <span id="distLine"></span><span id="bday"></span>
          </div>
          <p class="touch-hint"><span aria-hidden="true">◌</span> 轻轻碰一下，打开一段日常</p>
        </div>
        <nav class="bubble-field" id="cards" aria-label="回忆与日常"><!-- 入口由 JS 生成 --></nav>
        </div>
        <footer class="home-foot">
          <div class="home-signature"><button class="star-egg" id="starEgg" type="button" aria-label="一颗小星星" title="?">✧</button><span>Made by 狗狗</span></div>
          <div class="home-tools">
            <button class="theme-btn" id="themeBtn" type="button"><span class="theme-swirl" aria-hidden="true"></span>换个颜色</button>
            <button class="up-link" id="upLink" type="button"><span aria-hidden="true">＋</span>添张照片</button>
          </div>
        </footer>
      </div>
    </section>

    <!-- ===== 时间线 ===== -->
    <section class="view" id="view-timeline">
      <h2 class="view-h">我们的故事</h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- ===== 地图（省份） ===== -->
    <section class="view" id="view-map">
      <h2 class="view-h">我们一起去过的地方</h2>
      <div class="map-legend">
        <span class="lg-item"><i class="lg-dot lg-home"></i>狗狗在的地方</span>
        <span class="lg-item"><i class="lg-dot lg-her"></i>宝宝在的地方</span>
        <span class="lg-item"><i class="lg-dot lg-visit"></i>一起玩过的地方</span>
      </div>
      <div id="map"></div>
    </section>

    <!-- ===== 传照片（手机友好：选城市 → 选照片 → 自动上传） ===== -->
    <section class="view" id="view-upload">
      <h2 class="view-h">📤 传照片</h2>
      <p class="view-tip">从手机相册选照片，直接传到云端</p>
      <div class="up-wrap">
        <div class="up-city-title">这些照片拍在哪儿？</div>
        <div class="up-city" id="upCity"></div>
        <button class="up-btn" id="upFileBtn" type="button">
          <span class="up-btn-icon">＋</span>
          <span class="up-btn-text">从相册选择照片</span>
        </button>
        <input type="file" id="upFile" accept="image/*" multiple style="display:none">
        <div class="up-progress hidden" id="upProgress">
          <div class="up-bar"><div class="up-bar-in" id="upBar"></div></div>
          <p id="upStatus"></p>
        </div>
        <div class="up-thumbs" id="upThumbs"></div>
      </div>
    </section>

    <!-- ===== 城市选择面板（点省份后弹出） ===== -->
    <div class="city-panel hidden" id="cityPanel">
      <button class="city-panel-close" id="cityPanelClose">✕</button>
      <h3 class="city-panel-title" id="cityPanelTitle"></h3>
      <div class="city-list" id="cityList"></div>
    </div>

    <!-- ===== 相册 ===== -->
    <section class="view" id="view-gallery">
      <h2 class="view-h">我们的相册</h2>
      <button class="proj-btn" id="projBtn">🌙 投影模式</button>
      <button class="proj-btn dupe-btn hidden" id="dupeBtn">🗑 删除重复照片</button>
      <p class="view-tip dupe-tip hidden" id="dupeTip"></p>
      <p class="view-tip">点照片放大 · 投影模式会自动轮播</p>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- ===== 她的摄影 ===== -->
    <section class="view" id="view-her">
      <h2 class="view-h">你眼里的世界</h2>
      <p class="view-tip">大摄影师宝宝的作品</p>
      <div class="gallery" id="herGallery"></div>
    </section>

    <!-- ===== 信 ===== -->
    <section class="view" id="view-letter">
      <h2 class="view-h">写给你的信</h2>
      <div class="letter" id="letter"></div>
      <div class="lyrics" id="lyrics"></div>
    </section>

    <!-- ===== 睡前 ===== -->
    <section class="view sleep-sec" id="view-sleep">
      <h2 class="view-h">晚安</h2>
      <div class="sleep" id="sleep"></div>
    </section>

    <!-- ===== 重要日子倒数 ===== -->
    <section class="view" id="view-days">
      <h2 class="view-h">重要日子</h2>
      <p class="view-tip">好多好多重要的日子</p>
      <div class="days-grid" id="daysGrid"></div>
    </section>

    <!-- ===== 想一起做的事 ===== -->
    <section class="view" id="view-wish">
      <h2 class="view-h">饱饱和狗狗要做的n件新鲜事</h2>
      <p class="view-tip">肯定能在几十年里面做完哒</p>
      <div class="wish-progress"><span id="wishProgress"></span></div>
      <div class="wishlist" id="wishlist"></div>
    </section>

  </div>

  <!-- ===== 音乐播放器 ===== -->
  <div class="player hidden" id="player">
    <div class="player-bar">
      <div class="pl-eq" id="plEq"><i></i><i></i><i></i><i></i></div>
      <button class="pl-btn" id="plPrev" title="上一首">⏮</button>
      <button class="pl-btn pl-play" id="plPlay" title="播放/暂停">▶</button>
      <button class="pl-btn" id="plNext" title="下一首">⏭</button>
      <span class="pl-title" id="plTitle">选择音乐 ♪</span>
      <button class="pl-btn" id="plList" title="歌单">☰</button>
      <button class="pl-btn" id="plVol" title="音量">🔊</button>
    </div>
    <div class="player-list" id="playerList"></div>
    <div class="vol-panel hidden" id="volPanel">
      <input type="range" id="volRange" min="0" max="1" step="0.05" value="1">
    </div>
  </div>
  <audio id="audio"></audio>

  <!-- ===== 大图 / 投影 ===== -->
  <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="照片浏览">
    <button class="lb-close" id="lbClose" aria-label="关闭照片">✕</button>
    <span id="lbCount" class="lb-count" aria-live="polite"></span>
    <button class="lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <div id="lbStage" class="lb-stage"><img id="lbImg" alt="" /></div>
    <button class="lb-next" id="lbNext" aria-label="下一张">›</button>
    <div class="lb-bottom">
      <p class="lb-cap" id="lbCap"></p>
      <div class="lb-tools">
        <button id="lbZoom" aria-pressed="false">放大 2 倍</button>
        <button id="lbCover" hidden>设为本机封面</button>
        <span id="lbProjection" hidden><button id="lbPause">暂停</button><label>间隔 <select id="lbSpeed"><option value="3000">3 秒</option><option value="4500" selected>4.5 秒</option><option value="7000">7 秒</option><option value="10000">10 秒</option></select></label></span>
      </div>
    </div>
  </div>

  <!-- ===== 悄悄话 ===== -->
  <div class="secret-box hidden" id="secretBox">
    <p id="secretText"></p>
    <button id="secretClose">知道啦</button>
  </div>

  <!-- 编辑模式按钮（左下角齿轮，需编辑密码） -->
  <button class="edit-btn hidden" id="editBtn" title="编辑模式">⚙</button>
  <div class="toast hidden" id="toast"></div>

  <!-- ===== 主题选择面板（主页点"换主题"弹出） ===== -->
  <div class="theme-panel hidden" id="themePanel"></div>

  <!-- ===== 通用输入弹层（兼容 iOS Safari：替代 prompt） ===== -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal">
      <p class="modal-title" id="modalTitle"></p>
      <input class="modal-input" id="modalInput" type="text" autocomplete="off">
      <div class="modal-btns">
        <button class="modal-btn modal-cancel" id="modalCancel">取消</button>
        <button class="modal-btn modal-ok" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <script src="assets/vendor/echarts.min.js"></script>
  <script src="assets/vendor/supabase-js.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/bubbles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
